<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saman Khamesian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #F9F6F0;
            --text-primary: #2A2825;
            --text-secondary: #736E65;
            --accent: #EE5D29;
            --border-color: #E6DFD5;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2.5rem;
        }
        .name {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(2.6rem, 8vw, 5.4rem);
            line-height: 1.05;
            letter-spacing: 0.01em;
            color: transparent;
            background:
                repeating-linear-gradient(90deg,
                    transparent 0, transparent 16px,
                    rgba(42,40,37,0.55) 16px, rgba(42,40,37,0.55) 18px),
                repeating-linear-gradient(0deg,
                    transparent 0, transparent 16px,
                    rgba(42,40,37,0.55) 16px, rgba(42,40,37,0.55) 18px),
                var(--accent);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 2px var(--text-primary);
            text-shadow:
                2px 2px 0 var(--text-primary),
                4px 4px 0 var(--text-primary),
                6px 6px 0 var(--text-primary);
        }
        .photo-frame {
            flex-shrink: 0;
            width: clamp(140px, 22vw, 220px);
            height: clamp(140px, 22vw, 220px);
            border-radius: 50%;
            overflow: hidden;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 640px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                gap: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1 class="name">SAMAN<br>KHAMESIAN</h1>
            <div class="photo-frame">
                <img src="images/profile.jpg" alt="Saman Khamesian">
            </div>
        </div>
    </div>
</body>
</html>
